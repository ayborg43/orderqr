<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061a12">
<title>Kitchen — The Corner Table</title>
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body class="kds">
<header class="k-head">
  <h1>Kitchen</h1>
  <span class="k-live" id="connWrap"><i></i><span id="conn">connecting…</span></span>
  <span class="spacer"></span>
  <a class="btn small" href="/" id="homeLink">Home</a>
</header>
<main class="wrap">
  <div class="chips" id="stations" role="group" aria-label="Stations"></div>
  <div style="margin-top:18px" id="assist"></div>
  <div class="kds-board" id="board" aria-live="polite"></div>
</main>
<script src="/ui.js"></script>
<script>
const { $, $$, esc, fmt, icon, send, api } = UI;
const STATIONS = ['Grill', 'Kitchen', 'Drinks', 'Dessert'];
let station = '', orders = [], seen = null;
$('#homeLink').innerHTML = icon('home') + 'Home';

function minsAgo(iso) { return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000)); }
async function load() {
  const { data: d } = await api('/api/orders');
  orders = (d.orders || []).filter(o => o.payment.state === 'paid-demo' && o.status !== 'Served' && o.status !== 'Cancelled')
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  render();
  const { data: a } = await api('/api/assist'); const reqs = a.requests || [];
  $('#assist').innerHTML = reqs.length ? `<div class="k-assist" role="alert">${icon('bell')}<span><b>Staff requested:</b></span>${reqs.map(r => `<span class="row" style="gap:8px"><b>${esc(r.tableLabel)}</b><button class="btn small" type="button" onclick="doneAssist('${esc(r.id)}')">Done</button></span>`).join('')}</div>` : '';
}
window.doneAssist = async (id) => { await send('/api/assist/' + id + '/done', 'POST'); load(); };

function renderStations() {
  const count = (s) => orders.filter(o => !s || o.items.some(i => i.station === s)).length;
  $('#stations').innerHTML = ['', ...STATIONS].map(s => `<button class="chip ${s === station ? 'on' : ''}" type="button" data-s="${s}" aria-pressed="${s === station}">${s || 'All stations'}<span class="count">${count(s)}</span></button>`).join('');
}
function action(o) {
  const next = { Received: ['Preparing', 'Start preparing', 'yolk'], Preparing: ['Ready', 'Mark ready', ''], Ready: ['Served', 'Served', ''] }[o.status];
  return next ? `<button class="btn lg ${next[2]}" type="button" onclick="setStatus('${esc(o.id)}','${next[0]}')">${icon('check')}${next[1]}</button>` : '';
}
function ticket(o) {
  const age = minsAgo(o.createdAt);
  const items = o.items.filter(i => !station || i.station === station);
  return `<article class="ticket ${esc(o.status)} ${seen && !seen.has(o.id) ? 'fresh' : ''}" data-id="${esc(o.id)}">
    <div class="ticket__head"><span class="ticket__table">${esc(o.tableLabel)}</span><span class="ticket__id">${esc(o.id)}</span>
      <span class="ticket__age ${age >= 12 ? 'late' : ''}" title="Time since order">${icon('clock')}${age} min</span></div>
    <div class="ticket__status"><span class="badge ${esc(o.status)}">${esc(o.status)}</span><span>${new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · ${fmt(o.total)}</span></div>
    <div class="ticket__items">${items.map(i => `<div class="t-item"><span class="t-item__qty">${i.qty}×</span>
      <span class="t-item__name">${esc(i.name)}<span class="tag">${esc(i.station)}</span></span>
      ${i.modifiers.length ? `<span class="t-item__mods">${i.modifiers.map(m => esc(m.group) + ': ' + esc(m.name)).join(' · ')}</span>` : ''}
      ${i.note ? `<span class="t-item__note">${icon('note')}<span>${esc(i.note)}</span></span>` : ''}</div>`).join('')}</div>
    <div class="ticket__foot">${action(o)}<button class="btn plain" type="button" onclick="cancelOrder('${esc(o.id)}')">Can’t fulfil</button></div>
  </article>`;
}
function render() {
  renderStations();
  const list = orders.filter(o => !station || o.items.some(i => i.station === station));
  $('#board').innerHTML = list.length ? list.map(ticket).join('')
    : `<div class="k-empty">${icon('checkCircle')}<strong>${station ? station + ' is clear' : 'All clear'}</strong>New paid orders appear here the moment they land.</div>`;
  seen = new Set(orders.map(o => o.id));
}
window.setStatus = async (id, status) => { await send('/api/orders/' + id, 'PATCH', { status }); load(); };
window.cancelOrder = async (id) => { if (confirm('Cancel this order because the kitchen cannot fulfil it? The guest will be told.')) setStatus(id, 'Cancelled'); };
$('#stations').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; station = b.dataset.s; render(); });

function setConn(cls, txt) { $('#connWrap').className = 'k-live ' + cls; $('#conn').textContent = txt; }
try {
  const es = new EventSource('/api/events');
  es.addEventListener('ready', () => setConn('on', 'Live'));
  es.addEventListener('order', load); es.addEventListener('assist', load);
  es.onerror = () => setConn('bad', 'Reconnecting — polling');
} catch { setConn('bad', 'Polling'); }
setInterval(load, 6000);
setInterval(() => { if (orders.length) render(); }, 30000);
load();
</script>
</body>
</html>
